name: Integration

# Live provider tests cost money and need credentials, so they never run on a
# pull request. Trigger them by hand, or let the nightly run catch provider
# wire-format drift.
on:
  workflow_dispatch:
    inputs:
      provider:
        description: "Provider to exercise (blank runs every configured provider)"
        required: false
        default: ""
        type: choice
        options: ["", anthropic, gemini, sarvam, openai]
  schedule:
    - cron: "0 3 * * 1" # Mondays, 03:00 UTC

permissions:
  contents: read

concurrency:
  group: integration
  cancel-in-progress: false

jobs:
  integration:
    name: Live provider tests
    runs-on: ubuntu-latest
    # Point this environment at the repository secrets below and require
    # approval if you want a human gate before spending provider quota.
    environment: integration
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e '.[dev]'

      - name: Run integration tests
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_PORT_INTEGRATION_PROVIDER: ${{ inputs.provider }}
        # Tests skip themselves when their credential is absent, so a partially
        # configured repository still produces a useful run.
        run: pytest tests/integration -m integration -ra
