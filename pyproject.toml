[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "llm-port"
version = "0.1.0"
description = "Typed, provider-neutral chat and reliable tool calling for hosted and local LLMs."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Sanket Naik", email = "sanketn@gmail.com" }]
keywords = [
  "llm",
  "tool-calling",
  "anthropic",
  "gemini",
  "openai",
  "ollama",
  "bedrock",
  "vertex-ai",
  "groq",
  "openrouter",
  "mistral",
  "vllm",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40.0"]
gemini = ["google-genai>=1.0.0"]
sarvam = ["sarvamai>=0.1.28"]
# Covers every provider that speaks the OpenAI wire format: OpenAI, Azure
# OpenAI, Groq, OpenRouter, DeepSeek, Together, Fireworks, xAI, Mistral, and
# the local servers (Ollama, LM Studio, vLLM, llama.cpp, TGI).
openai = ["openai>=1.40.0"]
bedrock = ["boto3>=1.34"]
vertex = ["google-cloud-aiplatform>=1.60"]
all = ["llm-port[anthropic,bedrock,gemini,openai,sarvam,vertex]"]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.11",
  "build>=1.2",
]

[project.urls]
Homepage = "https://github.com/sanketnaik/llm-port"
Source = "https://github.com/sanketnaik/llm-port"
Issues = "https://github.com/sanketnaik/llm-port/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_port"]

[tool.hatch.build.targets.sdist]
include = ["src/llm_port", "tests", "README.md", "LICENSE", "Makefile"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "integration: hits a live provider; requires credentials and is deselected by default",
]

[tool.coverage.run]
source = ["llm_port"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
